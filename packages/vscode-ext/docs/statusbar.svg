  <text x="712" y="793" font-family="Segoe UI, sans-serif" font-size="11" fill="#ffffff" font-weight="500">⚡ Claude 72% | Copilot 91% | Codex 8% | Grok 55%</text>
  <!-- Other right-side items -->
  <text x="1175" y="793" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">UTF-8</text>
  <text x="1220" y="793" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">TypeScript</text>
</svg>
