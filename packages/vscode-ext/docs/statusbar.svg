  <!-- Weekly ring 97% -->
  <circle cx="1020" cy="180" r="26" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="5.5"/>
  <circle cx="1020" cy="180" r="26" fill="none" stroke="#2ecc71" stroke-width="5.5" stroke-dasharray="163.36" stroke-dashoffset="4.90" stroke-linecap="round" transform="rotate(-90 1020 180)"/>
  <text x="1020" y="184" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">97%</text>
  <text x="1020" y="199" font-family="Segoe UI, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle">Weekly · 149h 54m</text>

