  <circle cx="1020" cy="388" r="26" fill="none" stroke="#f39c12" stroke-width="5.5" stroke-dasharray="163.36" stroke-dashoffset="93.12" stroke-linecap="round" transform="rotate(-90 1020 388)"/>
  <text x="1020" y="392" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">43%</text>
  <text x="1020" y="407" font-family="Segoe UI, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle">Weekly · 72h 10m</text>

  <!-- Grok card (#1c1c1e) — session short-window + weekly SuperGrok pool -->
  <rect x="910" y="432" width="360" height="108" rx="14" fill="#1c1c1e"/>
  <rect x="910" y="432" width="360" height="108" rx="14" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <!-- Simple monochrome Grok mark (face) -->
  <circle cx="934" cy="454" r="9" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="931" cy="452" r="1.2" fill="#ffffff"/>
  <circle cx="937" cy="452" r="1.2" fill="#ffffff"/>
  <path d="M929.5 457.2c1 1.3 2.1 1.9 3.5 1.9s2.5-.6 3.5-1.9" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
  <text x="950" y="459" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Grok</text>
  <text x="1230" y="459" font-family="Segoe UI, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="end">Updated just now</text>
  <!-- Session ring 55% -->
  <circle cx="954" cy="506" r="26" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="5.5"/>
  <circle cx="954" cy="506" r="26" fill="none" stroke="#f39c12" stroke-width="5.5" stroke-dasharray="163.36" stroke-dashoffset="73.51" stroke-linecap="round" transform="rotate(-90 954 506)"/>
  <text x="954" y="510" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">55%</text>
  <text x="954" y="525" font-family="Segoe UI, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle">Session · 1h 48m</text>
  <!-- Weekly ring 84% -->
  <circle cx="1020" cy="506" r="26" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="5.5"/>
  <circle cx="1020" cy="506" r="26" fill="none" stroke="#2ecc71" stroke-width="5.5" stroke-dasharray="163.36" stroke-dashoffset="26.14" stroke-linecap="round" transform="rotate(-90 1020 506)"/>
  <text x="1020" y="510" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">84%</text>
  <text x="1020" y="525" font-family="Segoe UI, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle">Weekly · 3d 12h</text>

  <!-- Panel bottom edge fade into editor -->
  <rect x="900" y="550" width="380" height="96" fill="#0d1117"/>

  <!-- Status bar -->
  <rect x="0" y="778" width="1280" height="22" fill="#007acc"/>
  <!-- Left side status bar items -->
  <text x="10" y="793" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">⎇ main</text>
  <text x="80" y="793" font-family="Segoe UI, sans-serif" font-size="12" fill="#ffffff">⚠ 0</text>
  <!-- Right side - extension status includes Grok -->
