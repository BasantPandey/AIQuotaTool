  <circle cx="954" cy="388" r="26" fill="none" stroke="#e74c3c" stroke-width="5.5" stroke-dasharray="163.36" stroke-dashoffset="150.29" stroke-linecap="round" transform="rotate(-90 954 388)"/>
  <text x="954" y="392" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">8%</text>
  <text x="954" y="407" font-family="Segoe UI, sans-serif" font-size="8" fill="rgba(255,255,255,0.6)" text-anchor="middle">Session · 1h 2m</text>
  <!-- Weekly ring 43% -->
