  <text x="950" y="250" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Copilot</text>
  <circle cx="954" cy="280" r="22" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="5"/>
  <circle cx="954" cy="280" r="22" fill="none" stroke="#2ecc71" stroke-width="5" stroke-dasharray="138.23" stroke-dashoffset="12.44" stroke-linecap="round" transform="rotate(-90 954 280)"/>
