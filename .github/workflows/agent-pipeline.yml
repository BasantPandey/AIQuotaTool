name: Agent Pipeline

on:
  issues:
    types: [labeled]

env:
  IMAGE_NAME: ai-quota-tool-agent

jobs:
  agent:
    if: github.event.label.name == 'ready-for-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: agent-pipeline
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME .github/agent-docker/

      - name: Run agent
        id: agent
        run: |
          docker run --rm \
            --workdir /workspace \
            -v "$PWD:/workspace" \
            -e ISSUE_TITLE \
            -e ISSUE_BODY \
            -e DEEPSEEK_API_KEY \
            -e GITHUB_TOKEN \
            "$IMAGE_NAME"
        continue-on-error: true

      - name: Validation gate
        id: validate
        if: success()
        run: |
          FAILED=0

          echo "=== type-check ==="
          if pnpm turbo type-check 2>&1 | tee /tmp/type-check.log; then
            echo "type-check: PASSED"
          else
            echo "type-check: FAILED"
            FAILED=1
          fi

          echo "=== test ==="
          if pnpm turbo test 2>&1 | tee /tmp/test.log; then
            echo "test: PASSED"
          else
            echo "test: FAILED"
            FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            {
              echo "Validation failed for this issue."
              echo ""
              echo "### type-check"
              echo '```'
              tail -60 /tmp/type-check.log
              echo '```'
              echo ""
              echo "### test"
              echo '```'
              tail -60 /tmp/test.log
              echo '```'
            } > /tmp/validation-failure.md
            exit 1
          fi

          echo "All validation checks passed."

      - name: Comment validation failure
        if: failure() && steps.validate.outcome == 'failure'
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file /tmp/validation-failure.md

      - name: Commit and push changes
        if: success()
        id: push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="agent/issue-${ISSUE_NUMBER}-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "[agent] $ISSUE_TITLE

          Fixes #$ISSUE_NUMBER"
          git push origin "$BRANCH"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.push.outputs.changed == 'true'
        run: |
          gh pr create \
            --title "$ISSUE_TITLE" \
            --body "Automated implementation for #$ISSUE_NUMBER

          > This PR was generated by the agent pipeline. Review carefully before merging." \
            --base main \
            --head "${{ steps.push.outputs.branch }}"

      - name: Comment pipeline failure
        if: failure() && steps.validate.outcome != 'failure'
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --body "The agent pipeline did not complete for this issue (the run may have timed out after 30 minutes or encountered an error).

          Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."
